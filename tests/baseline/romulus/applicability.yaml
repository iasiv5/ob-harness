# romulus 本地适用性:标 skip/xfail 的 AR + reason + source。
# default: applicable — 未列出的 AR 均执行 probe 判定。
# statuses: applicable(默认) / skip(不调 probe) / xfail(调 probe: 预期 fail->xfail, 意外 pass->xpass)
default: applicable
overrides:
  BMC-7-7-1:
    status: skip
    reason: romulus 未启用 banner 定制 (QEMU 不可仿真)
    source: manual
  BMC-XF-1:
    status: xfail
    reason: romulus 预期不填 Accounts.Description, 跟踪中
    source: manual
