# core suite — Redfish service / firmware inventory 基础可达性 (布局 v2 分片, 顶层见 ../ar_probes.yaml)
ars:
  - ar: BMC-2-2-1
    name: Redfish service reachable
    probe: redfish
    suite: core
    request:
      method: GET
      path: /redfish/v1
    assert:
      - type: status_in
        value: [200]
    depends_on: []
    rationale: Redfish 根服务须可达 (HTTP 200)

  - ar: BMC-3-15-1
    name: BMC firmware inventory queryable
    probe: redfish
    suite: core
    request:
      method: GET
      path: /redfish/v1/Managers/bmc
    assert:
      - type: status_in
        value: [200]
      - type: json_path_exists
        path: FirmwareVersion
    depends_on: [BMC-2-2-1]
    rationale: >
      锚点重评(2026-08-17): Managers/bmc.FirmwareVersion 是 Redfish 规范
      中 BMC 版本上报的正位锚点, 实测已连续 5/5 稳定填充
      (3.1.0-dev-896-g13fe9141ef-dirty), 从降级锚点升回。此前 bmcweb
      software functional path 映射缺口时期曾降级锚到
      UpdateService/FirmwareInventory collection 非空(弱断言), 该降级
      锚点随缺口修复退役 — 降级不是永久形态, 见 README 重评规则。

