# smoke suite — 5 AR 服务可达性门(旧 `ob smoke` 收编, ADR-0028)。
# 语义等价映射: SMOKE-01/02 = 服务根/Manager 资源结构标记; SMOKE-03 = 固件版本
# 非空(规范名 FirmwareVersion 或 alias SoftwareVersion); SMOKE-04 = IPMI mc info
# rc==0(旧 judge 同款, 只验 rc——mc info 输出无稳定可断子串); SMOKE-05 = SSH TCP
# 就绪门(默认 30 次 × 5s, 对齐旧 OB_SMOKE_READY_ATTEMPTS)。
ars:
  - ar: SMOKE-01
    name: Redfish service root reachable
    probe: redfish
    suite: smoke
    request:
      method: GET
      path: /redfish/v1
    assert:
      - type: status_in
        value: [200]
      - type: body_contains_any
        value: ["@Redfish.Copyright", "RedfishVersion", "ServiceRoot.v1"]
    depends_on: []
    rationale: >
      Redfish 根服务可达且是真实 ServiceRoot(结构标记任一命中, 防
      placeholder/错误页误判 pass)。

  - ar: SMOKE-02
    name: Redfish Manager resource reachable
    probe: redfish
    suite: smoke
    request:
      method: GET
      path: /redfish/v1/Managers/bmc
    assert:
      - type: status_in
        value: [200]
      - type: body_contains_any
        value: ["ManagerType", "\"UUID\"", "#Manager"]
    depends_on: []
    rationale: >
      Managers/bmc 资源可达且是真实 Manager 文档(结构标记任一命中)。

  - ar: SMOKE-03
    name: BMC firmware version reported non-empty
    probe: redfish
    suite: smoke
    request:
      method: GET
      path: /redfish/v1/Managers/bmc
    assert:
      - type: json_path_nonempty_any
        path: [FirmwareVersion, SoftwareVersion]
    depends_on: []
    rationale: >
      固件版本上报非空(接受规范名 FirmwareVersion 或 alias SoftwareVersion;
      json_path_exists 会把空串误判 pass, 故用 nonempty 判定)。

  - ar: SMOKE-04
    name: IPMI mc info exits zero
    probe: ipmi
    suite: smoke
    request:
      command: mc_info
    assert:
      - type: exitcode_zero
    depends_on: []
    rationale: >
      IPMI(lanplus)通道可达, ipmitool mc info rc==0 即过(与旧 smoke judge
      同款——mc info 输出无稳定可断子串, 不做 output 断言)。

  - ar: SMOKE-05
    name: SSH TCP port accepting connections
    probe: ssh_tcp
    suite: smoke
    request:
      attempts: 30
      interval: 5
    assert:
      - type: tcp_connectable
    depends_on: []
    rationale: >
      SSH TCP 就绪门(30 次 × 5s 有界轮询, 对齐旧 OB_SMOKE_READY_ATTEMPTS);
      超时判 fail(BMC truth), 不是 infra error。
